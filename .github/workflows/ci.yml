name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1' # Monday 09:23 UTC; default branch, best-effort timing
  workflow_dispatch:
    inputs:
      compatibility:
        description: Also run macOS compatibility checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  source:
    name: ${{ matrix.os == 'ubuntu-24.04' && 'Source and fixture checks' || 'macOS compatibility' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || inputs.compatibility == true) && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Source checks and reports
        id: checks
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/run.py source --output "$RUNNER_TEMP/yttv-source"
      - name: Validate and summarize source evidence
        if: ${{ always() }}
        env:
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_ARTIFACT_NAME: source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-node24
        run: python3 scripts/ci/finalize.py source --output "$RUNNER_TEMP/yttv-source" --outcome "$CHECK_OUTCOME"
      - name: Retain source diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-node24
          path: ${{ runner.temp }}/yttv-source/
          retention-days: 7
          if-no-files-found: error

  security:
    name: Workflow and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install verified tools
        run: |
          python3 scripts/ci/install_tools.py "$RUNNER_TEMP/yttv-tools"
          echo "$RUNNER_TEMP/yttv-tools" >> "$GITHUB_PATH"
      - name: Workflow, dependency and secret reports
        id: checks
        if: ${{ !cancelled() }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/run.py security --output "$RUNNER_TEMP/yttv-security"
      - name: Validate and summarize security evidence
        if: ${{ always() }}
        env:
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_ARTIFACT_NAME: security-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}
        run: python3 scripts/ci/finalize.py security --output "$RUNNER_TEMP/yttv-security" --outcome "$CHECK_OUTCOME"
      - name: Retain security diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}
          path: ${{ runner.temp }}/yttv-security/
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Repository checks
    needs: [source, security]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Required results
        env:
          SOURCE: ${{ needs.source.result }}
          SECURITY: ${{ needs.security.result }}
          TESTED_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          source, security = os.environ['SOURCE'], os.environ['SECURITY']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(f"## Repository checks\n\nTested {os.environ['TESTED_SHA']}; event {os.environ['EVENT']}.\n\n")
              for name, result in [('Source', source), ('Security', security)]:
                  report.write(f"- {name}: {result.upper()} (missing/skipped/cancelled is a failed gate).\n")
              report.write('\nReports and diagnostics: source/security job summaries and run-specific artifacts, retained 7 days.\n')
          raise SystemExit(0 if source == security == 'success' else 1)
          PY
