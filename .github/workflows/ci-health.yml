name: CI health

on:
  schedule:
    - cron: '53 9 * * 1' # Monday 09:53 UTC; default branch, best effort
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum completed CI runs in the last 30 days (1–30)
        type: number
        default: 30

permissions:
  contents: read
  actions: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health:
    name: Advisory CI health
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read bounded run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_LIMIT: ${{ inputs.max_runs }}
        run: python3 scripts/ci/history.py --repository "$GITHUB_REPOSITORY" --limit "${HISTORY_LIMIT:-30}" --output "$RUNNER_TEMP/yttv-health"
      - name: Retain metadata report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yttv-health/
          retention-days: 7
          if-no-files-found: error
